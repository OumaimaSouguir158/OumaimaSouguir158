<svg viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, Courier New, monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#181825"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#cba6f7;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#cba6f7;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#89b4fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#89b4fa;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" fill="url(#bg)" rx="12"/>

  <!-- Decorative dots top-left -->
  <circle cx="20" cy="20" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="20" r="5" fill="#febc2e"/>
  <circle cx="52" cy="20" r="5" fill="#28c840"/>

  <!-- Top bar line -->
  <rect x="0" y="36" width="900" height="1" fill="#2d2b45"/>

  <!-- Accent line -->
  <rect x="0" y="37" width="900" height="1" fill="url(#line)" opacity="0.6"/>

  <!-- Prompt symbol -->
  <text x="40" y="92" font-size="20" fill="#cba6f7" filter="url(#glow)" font-weight="500">❯</text>

  <!-- Main name -->
  <text x="70" y="92" font-size="26" font-weight="700" fill="#cdd6f4" letter-spacing="-0.5">
    Oumaima Souguir
  </text>

  <!-- Role line -->
  <text x="70" y="120" font-size="13" fill="#6e6a86" letter-spacing="0.5">
    Software Engineer
    <tspan fill="#4a4869"> · </tspan>
    <tspan fill="#89dceb">ML Practitioner</tspan>
    <tspan fill="#4a4869"> · </tspan>
    <tspan fill="#a6e3a1">Security-Aware Dev</tspan>
    <tspan fill="#4a4869">  //  </tspan>
    <tspan fill="#f9e2af">CNAM Paris — 16.97/20</tspan>
  </text>

  <!-- Right side accent -->
  <text x="830" y="85" font-size="28" fill="#cba6f7" opacity="0.15" text-anchor="middle">{ }</text>
  <text x="830" y="115" font-size="10" fill="#6e6a86" text-anchor="middle" letter-spacing="1">Python · ML · Security</text>

  <!-- Bottom line -->
  <rect x="0" y="148" width="900" height="1" fill="#2d2b45"/>

  <!-- Animated cursor -->
  <rect x="319" y="78" width="10" height="18" fill="#cba6f7" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
